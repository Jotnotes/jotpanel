<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f607f" />
    <title>JotPanel</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #f5f7fa; }
      /* The panel is a tool, not a desktop: it fills the tab and scrolls
         inside its own content area rather than the page. */
      .panel-boot {
        height: 100%; display: flex; align-items: center; justify-content: center;
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #687486;
      }
      .panel-signin {
        height: 100%; background: #10101a; display: flex;
        align-items: center; justify-content: center; padding: 20px;
      }
      /* Square corners and small type, the same rules the panel behind it
         follows, so signing in does not look like a different product. */
      .panel-login {
        width: 100%; max-width: 320px; background: #171e26; border: 1px solid #29333d;
        padding: 22px; display: flex; flex-direction: column;
        font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #d9e0e7;
      }
      .panel-login h1 { font-size: 14px; font-weight: 800; margin-bottom: 3px; color: #fff; }
      .panel-login p { font-size: 11px; color: #8b98a5; margin-bottom: 16px; }
      .panel-login label {
        font-size: 9.5px; font-weight: 800; text-transform: uppercase;
        letter-spacing: .08em; color: #8b98a5; margin-bottom: 5px;
      }
      .panel-login input {
        background: #10161d; border: 1px solid #2f3a45; color: #e8edf2;
        padding: 8px 9px; font: 12px inherit; margin-bottom: 13px; outline: none; border-radius: 0;
      }
      .panel-login input:focus { border-color: #4d7fa3; }
      .panel-login button {
        background: #1d5e92; border: 1px solid #1d5e92; color: #fff;
        padding: 9px 11px; font: 700 12px inherit; cursor: pointer; border-radius: 0;
      }
      .panel-login button:hover:enabled { background: #174f7c; }
      .panel-login button:disabled { opacity: .5; cursor: default; }
      .panel-login-or {
        margin: 12px 0 10px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
        color: #6f7d8a; text-align: center; position: relative;
      }
      .panel-login button.panel-login-alt {
        background: transparent; border: 1px solid #3a4a58; color: #c7d3dd;
      }
      .panel-login button.panel-login-alt:hover:enabled { background: #1b2732; border-color: #4d7fa3; }
      .panel-login-error {
        margin-top: 11px; padding: 8px 9px; background: #2d1917;
        border: 1px solid #5d302b; color: #eab3ac; font-size: 11px; line-height: 1.45;
      }
      .panel-login small { margin-top: 14px; font-size: 10px; line-height: 1.5; color: #6f7d8a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/panel.jsx"></script>
  </body>
</html>
